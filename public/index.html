<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Inventario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="p-4 border-bottom d-flex align-items-center gap-3">
        <div class="bg-primary text-white p-2 rounded-3"><i class="bi bi-box-seam-fill"></i></div>
        <div>
          <h6 class="mb-0 fw-bold">StockPro</h6>
          <small class="text-muted">Panel Moderno</small>
        </div>
      </div>

      <nav class="sidebar-nav p-3 flex-grow-1 overflow-y-auto">
        <div class="nav-section-label">PANEL</div>
        <a href="#" class="nav-item active" data-page="dashboard">
          <i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span>
        </a>

        <div class="nav-section-label">INVENTARIO</div>
        <a href="#" class="nav-item" data-page="marcas">
          <i class="bi bi-bookmark-star"></i> <span class="flex-grow-1">Marcas</span>
          <span class="badge bg-primary-subtle text-primary" id="badge-marcas">0</span>
        </a>
        <a href="#" class="nav-item" data-page="modelos">
          <i class="bi bi-diagram-3"></i> <span class="flex-grow-1">Modelos</span>
          <span class="badge bg-primary-subtle text-primary" id="badge-modelos">0</span>
        </a>

        <div class="nav-section-label">ADMINISTRACIÓN</div>
        <a href="#" class="nav-item" data-page="proveedores">
          <i class="bi bi-truck"></i> <span class="flex-grow-1">Proveedores</span>
          <span class="badge bg-primary-subtle text-primary" id="badge-proveedores">0</span>
        </a>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <!-- Botón hamburguesa para desplegar en móviles -->
          <button class="btn-toggle-sidebar" id="btnToggleSidebar">
            <i class="bi bi-list"></i>
          </button>
          <div class="fw-bold fs-5" id="topbarTitle">Dashboard</div>
        </div>
        
        <div class="d-flex align-items-center gap-3">
          <button class="btn-theme-toggle" id="btnThemeToggle" title="Cambiar tema">
            <i class="bi bi-sun-fill" id="themeIcon"></i>
          </button>
          <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">Conectado</span>
        </div>
      </header>

      <div class="page-wrapper" id="pageContainer">
        <!-- Inyección dinámica SPA -->
      </div>
    </main>

    <div id="modalsContainer"></div>
    <div class="toast-container" id="toastContainer"></div>

    <!-- Script principal con ES Modules -->
    <script type="module" src="js/app.js"></script>
    <script>
        // Lógica para abrir/cerrar sidebar en móvil
        const btnToggle = document.getElementById('btnToggleSidebar');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        btnToggle?.addEventListener('click', () => {
          sidebar.classList.toggle('open');
          overlay.classList.toggle('open');
        });

        overlay?.addEventListener('click', () => {
          sidebar.classList.remove('open');
          overlay.classList.remove('open');
        });

        // Lógica para el cambio de tema Día / Noche
        const themeToggleBtn = document.getElementById('btnThemeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        themeToggleBtn?.addEventListener('click', () => {
          const currentTheme = htmlElement.getAttribute('data-theme');
          const newTheme = currentTheme === 'light' ? 'dark' : 'light';
          
          htmlElement.setAttribute('data-theme', newTheme);
          
          if (newTheme === 'dark') {
            themeIcon.className = 'bi bi-moon-fill';
          } else {
            themeIcon.className = 'bi bi-sun-fill';
          }
        });
    </script>
  </body>
</html>
